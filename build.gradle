buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// TermDeb offline mode property
ext {
    termdebOffline = project.hasProperty('termdebOffline') ? project.property('termdebOffline').toBoolean() : false
}
